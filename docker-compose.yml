services:
  app:
    build: .
    container_name: ask-my-docs-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_DB_PATH: /srv/app/data/app_data.db
    volumes:
      # Persist the sqlite conversation log across container restarts
      - app_data:/srv/app/data
    networks:
      - askmydocs

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ask-my-docs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app
    networks:
      - askmydocs

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ask-my-docs-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - askmydocs

networks:
  askmydocs:
    driver: bridge

volumes:
  app_data:
  prometheus_data:
  grafana_data:
